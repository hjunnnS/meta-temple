<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사사 · UI/UX 개선 시안 03</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeee6;color:#294334;font:14px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:27px 34px 20px;border-bottom:1px solid #ced4c6}.eyebrow{font-size:10px;letter-spacing:.18em;color:#7b8675}h1{font:29px/1.5 Georgia,serif;margin:4px 0 0}header p{font-size:12px;color:#697a62;line-height:1.9;margin:0}button,select{font:inherit;font-size:14px;cursor:pointer;min-height:44px}button:focus-visible,select:focus-visible{outline:3px solid #b49b53;outline-offset:3px}button{background:transparent;color:#37563c;border:1px solid #c5ceba;border-radius:25px;padding:8px 15px}button[aria-pressed=true]{background:#30533d;color:#fff8e5;border-color:#30533d}.toolbar{padding:16px 34px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spacer{flex:1}.states{padding:0 34px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:#607655}.states select{padding:7px 10px;color:#305039;background:#faf8ee;border:1px solid #c4cdb5;border-radius:7px}.states span{font-size:12px;color:#76856c}main{padding:0 34px 34px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 22px}article{min-width:0}.frame-box{min-width:0;position:relative;width:100%;aspect-ratio:1.6;overflow:hidden;border-radius:12px;background:#233d2e}iframe{position:absolute;inset:0;border:0;width:1280px;height:800px;transform-origin:top left;transform:scale(var(--scale,1));display:block}.frame-box.mobile{width:min(390px,100%);aspect-ratio:390/800;margin:auto}.frame-box.mobile iframe{width:390px;height:800px}.caption{display:flex;gap:13px;margin-top:12px}.num{font:26px Georgia,serif;color:#9d8e66}.caption strong{font-weight:500;font-size:17px}.caption p{font-size:13px;color:#6b7e61;margin:4px 0 0}.single{display:block;max-width:1348px;margin:auto}.single .caption strong{font-size:20px}.single .caption p{font-size:14px}.principles{align-self:center;border-top:1px solid #bcc9b0;padding:30px 20px}.principles h2{font:26px/1.7 Georgia,serif;font-weight:400;margin:12px 0}.principles p{color:#698060;line-height:2.1;font-size:14px}.policy{font-size:12px;border-top:1px solid #ccd5c0;color:#76856b;padding-top:12px}.footer{padding:0 34px 30px;color:#718068;font-size:12px}.changed{display:inline-block;border:1px solid #b9c8a7;color:#5d7750;border-radius:20px;padding:2px 10px;font-size:12px;margin-bottom:7px}@media(max-width:850px){header{padding:20px}h1{font-size:23px}header p{display:none}.toolbar{padding:14px 18px}.states{padding:0 18px 15px}.spacer{flex-basis:100%}main{grid-template-columns:1fr;padding:0 16px 24px}.principles{padding:20px 0}.footer{padding:0 18px 20px}}
</style><header><div><div class="eyebrow">SASA / EXPERIENCE DESIGN / 03</div><h1>공간은 넓게, 흐름은 끊김 없이</h1></div><p>점검 사항을 반영한 UI 시안<br>실제 서비스 미적용 · 로그인·구매·캐릭터 동작은 시연</p></header><div class="toolbar" id="toolbar"></div><div class="states"><label>신청 상태 <select id="case"><option value="normal">기본 흐름</option><option value="full">만석</option><option value="conflict">다른 방문자가 선택</option><option value="loginCancelled">로그인 취소</option><option value="expired">예약 시간 만료</option><option value="pending">결제 결과 확인 중</option><option value="installFailed">설치 실패·복구 중</option><option value="offline">연결 끊김</option></select></label><button id="notice">일정 알림 잠깐 보기</button><span>화면 안 버튼을 눌러 흐름을 확인하세요. 정책 미확정 사항은 확정하지 않았습니다.</span></div><main id="main"></main><div class="footer">기존 M2 #27 · M3 #35 · M4 #64·#76·#77의 화면 보완 시안입니다. 새 이슈 등록·개발 적용·공개 배포는 하지 않았습니다.</div><script>
const screens=[['arrival','입장 직후','짧은 첫 방문 안내는 접을 수 있습니다. 상시 메뉴는 지도·수행·내 모습 세 가지입니다.'],['explore','이동 중','현장 행동을 바로 실행합니다. E키 안내는 웹에만 표시하고 일정 알림은 잠시만 노출합니다.'],['offering','다섯 아이템 신청','아이템 → 줄·자리 → 내용·기간·금액 → 확인·예약. 닫아도 작성 내용과 위치가 유지됩니다.'],['practice','108배 수행 중','횟수와 중단만 작게 남깁니다. 중단 후 같은 방석 앞에 머물며, 참배·명상은 로그인 없이 시작합니다.'],['private','개인 공간','수행·꾸미기·돌아가기를 모았습니다. 수행을 마쳐도 개인 공간 안의 같은 자리에 남습니다.']];
const query=new URLSearchParams(location.search);let view=query.get('view')||'all',mobile=query.get('mobile')==='1',caseValue='normal';const main=document.querySelector('#main');let observer;
function render(){observer?.disconnect();document.querySelector('#toolbar').innerHTML=`<button data-view="all" aria-pressed="${view==='all'}">전체 비교</button>`+screens.map(s=>`<button data-view="${s[0]}" aria-pressed="${view===s[0]}">${s[1]}</button>`).join('')+`<span class="spacer"></span><button data-device="web" aria-pressed="${!mobile}">웹</button><button data-device="mobile" aria-pressed="${mobile}">모바일 웹</button>`;main.className=view==='all'?'':'single';main.innerHTML=(view==='all'?screens:screens.filter(s=>s[0]===view)).map(s=>`<article><div class="frame-box ${mobile?'mobile':''}"><iframe title="${s[1]} 시안" src="app.html?view=${s[0]}${s[0]==='offering'?'&state='+caseValue:''}"></iframe></div><div class="caption"><span class="num">0${screens.indexOf(s)+1}</span><div><strong>${s[1]}</strong><p>${s[2]}</p></div></div></article>`).join('')+(view==='all'?`<section class="principles"><span class="changed">점검 반영</span><h2>버튼을 줄이고,<br>필요한 안내는 남겼습니다.</h2><p>참배·명상은 비회원도 바로 이용.<br>108배 시작·자리 예약에서만 로그인.<br>신청 닫기·수행 중단 후 같은 장소 유지.<br>다섯 아이템과 처리 상태를 한 흐름으로.<br>모바일은 지도는 넓게, 입력창은 읽기 편하게.</p><div class="policy">7일·30일은 시안 표시이며 가격은 미정입니다.<br>시안 조작으로 실제 주문·이메일·저장은 발생하지 않습니다.</div></section>`:'');observer=new ResizeObserver(entries=>entries.forEach(e=>e.target.style.setProperty('--scale',e.contentRect.width/(mobile?390:1280))));main.querySelectorAll('.frame-box').forEach(el=>observer.observe(el));}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render();}if(b.dataset.device){mobile=b.dataset.device==='mobile';render();}if(b.id==='notice')main.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage({type:'notification'},location.origin));});document.querySelector('#case').onchange=e=>{caseValue=e.target.value;view='offering';render();};render();
</script></html>
