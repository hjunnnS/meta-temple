g:.8em;font-size:1.1em}.round svg,.dock svg,.cta svg{width:1.55em;height:1.55em}.dock{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);display:flex;gap:.45em;background:#173c32e8;border:1px solid #c7ccb05c;padding:.5em;border-radius:3em;backdrop-filter:blur(8px)}.dock button{display:flex;align-items:center;gap:.6em;background:transparent;color:#f5efd9;border:0;border-radius:2em;padding:.7em 1.1em;font-size:1.08em;white-space:nowrap}.dock button:hover,.dock button.active{background:#ffffff16}.dock svg{color:#d8c392}.tiny-location{position:absolute;left:3.2%;bottom:5.8%;font-size:.95em;letter-spacing:.08em;color:#fff8e9cc}.tiny-location span{display:block;color:#fff8e97d;font-size:.85em;margin-bottom:.4em}.arrival-note{position:absolute;top:19%;left:3.2%;max-width:24%;font-size:1em;line-height:1.9}.arrival-note strong{font:2em/1.7 Georgia,serif;font-weight:400;display:block}.arrival-note p{opacity:.85;font-size:1.05em;margin:.4em 0 1em}.line-link{padding:.4em 0;border:0;border-bottom:1px solid #f4e5b470;background:transparent;color:#f4e8c7;font-size:1em}.schedule-toast{position:absolute;top:13%;right:3%;background:#193e32e8;padding:1.05em 1.4em;border:1px solid #cabc9466;border-radius:1em;max-width:25%;font-size:.94em}.schedule-toast small{font-size:.9em;color:#d9c99e}.schedule-toast strong{font-size:1.3em;display:block;font-weight:500;margin:.3em 0}.schedule-toast button{font-size:.95em}.context{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);text-align:center}.context small{display:block;font-size:1em;color:#fdf7e7;margin-bottom:.8em;text-shadow:0 1px 5px #162f25}.cta{display:flex;align-items:center;justify-content:center;gap:.7em;padding:1em 1.8em;border:1px solid #d7c69c80;background:#f4efde;color:#274a3a;border-radius:2em;font-size:1.08em;white-space:nowrap}.key{font-size:.75em;border:1px solid #aeb8a5;padding:.1em .4em;border-radius:.3em;margin-right:.2em}.surface{color:#2e473b;background:#f8f5e9;border:1px solid #dbd7c8;border-radius:1.4em;padding:2em;position:absolute;font-size:1em;overflow:auto}.surface h2{font:2em/1.4 Georgia,serif;margin:0}.surface h3{font-size:1.15em;margin:1.6em 0 .7em}.surface p{font-size:1em;color:#788071;line-height:1.8}.close{position:absolute;right:1.2em;top:1em;border:0;background:transparent;font-size:1.7em;padding:.1em .3em}.pill{display:inline-block;background:#e8ecdf;border-radius:2em;padding:.35em .8em;color:#69755e;font-size:.85em;margin-bottom:1em}.offering{right:2.4%;top:12%;bottom:3%;width:31%;display:flex;flex-direction:column}.steps{display:flex;gap:.65em;color:#87917f;font-size:.85em;align-items:center;margin:1.4em 0 1.8em}.steps b{color:#35533c;font-weight:600}.steps i{height:1px;flex:1;background:#d4d9c9}.chosen{padding:1em 1.2em;background:#e9eddf;border-radius:.7em;display:flex;justify-content:space-between;align-items:center}.chosen strong{font-size:1.3em}.chosen small{display:block;font-size:.85em;color:#7e8876;margin-top:.3em}.textbtn{background:none;border:0;text-decoration:underline;text-underline-offset:.3em;font-size:.9em;color:#60765c;padding:.4em}.surface label{display:block;font-size:.95em;margin-top:1.4em}.surface label input:not([type=checkbox]),.surface textarea{width:100%;border:1px solid #d0d6c8;border-radius:.6em;background:#fffdf7;padding:.9em;color:#35513e;font-size:1em;margin-top:.5em}.surface textarea{height:6em;resize:none}.surface .check{display:flex;align-items:center;gap:.5em;margin:.9em 0;font-size:.9em}.surface .check input{accent-color:#315c44}.reservation{margin-top:auto;padding-top:1em}.primary{background:#284e3d;color:#fff6df;border:0;border-radius:.7em;padding:1em 1.5em;font-size:1em;width:100%;min-height:3em}.primary:hover{background:#38614b}.quiet{font-size:.85em!important;text-align:center;margin:.6em 0 0!important;color:#8b927e!important}.pin{position:absolute;left:43%;top:43%;background:#244f3bed;border:1px solid #e0cc91aa;color:#fff8df;padding:.5em .95em;border-radius:1.2em;font-size:.95em}.pin:after{content:" .8}.principles{padding:34px 24px;border-top:1px solid #bfc9bb;align-self:center}.principles h2{font:27px/1.7 Georgia,serif;font-weight:400;margin:0 0 18px}.principles p{color:#788170;line-height:2.2}.legend{display:flex;gap:20px;font-size:12px;color:#677561;margin-top:20px}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.single .caption{margin:20px 0}.single .caption strong{font-size:21px}.single .caption p{font-size:14px}.veil{position:absolute;inset:0;background:#142e2466;display:flex;align-items:center;justify-content:center;z-index:5}.veil .surface{position:relative;width:36%;max-height:88%;}.veil .surface.map-panel{width:64%}.map-image{position:relative;width:100%;aspect-ratio:1.55;background:url('map.jpg') center/cover;border-radius:.8em;margin:1.2em 0}.map-pin{position:absolute;font-size:.9em;border:1px solid #cfbf8c;background:#204a3be8;color:#fff6dc;padding:.6em 1em;border-radius:2em}.row-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.55em;margin:1em 0}.row-grid button{border:1px solid #c2cdb5;background:#e6eddb;padding:.8em;border-radius:.4em;font-size:.95em}.row-grid button:disabled{background:#dddcd2;color:#94978a}.row-grid button.selected{background:#33593f;color:#fff8dd;border-color:#33593f}.row-grid button:not(:disabled):hover{outline:2px solid #b5a16d}.row-choose{display:flex;gap:.5em;margin-top:1em}.row-choose button{flex:1;padding:.8em .3em;background:#e9eddf;border:1px solid #ccd4bf;border-radius:.5em;color:#4a6747;font-size:.95em}.row-choose button.selected{background:#355b44;color:white}.login-options button{margin:.4em 0}.status{font-size:.95em;background:#e6eddc;border-left:2px solid #9bb188;padding:1em;margin:1em 0}.menu-links{display:grid;gap:.6em;margin-top:1.5em}.menu-links button{background:transparent;border:1px solid #cdd5c6;padding:1em;border-radius:.5em;text-align:left;font-size:1.1em}.no-margin{margin:0}.mode-mobile{width:min(390px,100%);aspect-ratio:390/780}.mode-mobile .scene{font- <header class="review"><div><div class="eyebrow">SASA / EXPERIENCE DESIGN / 02</div><h1>사찰에 머무는 화면</h1></div><p>실제 맵을 배경으로 만든 UI 시안<br>서비스 미적용 · 신청·로그인은 시연용</p></header>
<div class="toolbar" id="toolbar"></div><main id="main"></main>
<script>
const icons={map:'<path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Z"/><path d="M9 3v16m6-14v16"/>',lotus:'<path d="M12 20C5 20 2 15 2 10c5 0 9 4 10 10Zm0 0c7 0 10-5 10-10-5 0-9 4-10 10Z"/><path d="M12 17C8 12 9 7 12 3c3 4 4 9 0 14Z"/>',person:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',coin:'<circle cx="12" cy="12" r="8"/><path d="M9 9h6v6H9Z"/>'};
const svg=name=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
const states=[['arrival','입장 직후','화면을 가리지 않는 환영 안내. 로그인 없이 바로 걷고 둘러봅니다.'],['explore','이동 중','가까이 온 장소의 행동만 표시. 전체 지도는 필요할 때 펼칩니다.'],['offering','연등 신청','현장과 선택한 자리를 보면서 오른쪽에서 신청합니다. 예약을 누를 때 로그인합니다.'],['practice','108배 수행 중','일반 메뉴를 접고 횟수·진행·중단만 남겨 수행에 집중합니다.'],['private','나만의 공간','수행·꾸미기·사찰로 돌아가기만 간결하게 배치합니다.']];
let current='all',mobile=false,selectedRow='C',selectedSeat='12';
const baseTop=()=>`<div class="top"><div class="brand"><span class="seal">山</span><div>사사<small>A MOMENT OF STILLNESS</small></div></div><button class="round" data-action="menu" aria-label="메뉴">${svg('menu')}</button></div>`;
const dock=()=>`<nav class="dock" aria-label="주요 메뉴"><button data-action="map">${svg('map')}공간</button><button data-action="practice">${svg('lotus')}수행</button><button data-action="appearance">${svg('person')}내 모습</button></nav>`;
function frame(id){let html=baseTop();if(id==='arrival'){html+=`<div class="arrival-note"><strong>잠시, 마음을 쉬어가세요.</strong><p>사사는 누구나 자유롭게<br>걷고 머물 수 있는 사찰입니다.</p><button class="line-link" data-action="map">사찰 지도 살펴보기 ↗</button></div><div class="tiny-location"><span>지금 머무는 곳</span>천왕문 진입길</div>`+dock();}
if(id==='explore'){html+=`<div class="schedule-toast"><small>곧 시작하는 일정 · 한국 시간</small><strong>18:00 저녁 예불</strong><button class="line-link" data-action="schedule">오늘의 일정 보기 ↗</button></div><div class="tiny-location"><span>지금 머무는 곳</span>연못 · 소원 정원</div><div class="context"><small>마음속 소원을 떠올려 보세요</small><button class="cta" data-action="coin">${svg('coin')}<span class="key">E</span>소원 동전 던지기</button></div>`+dock();}
if(id==='offering'){html+=`<div class="pin">선택한 자리 · C–12</div><section class="surface offering"><button class="close" data-action="dismiss" aria-label="신청 닫기">×</button><span class="pill">종무소 · 등과 소원 접수</span><h2>연등에 마음을 담다</h2><div class="steps"><span>자리 선택</span><i></i><b>신청 내용</b><i></i><span>예약</span></div><div class="chosen"><div><strong>C줄 · 12번</strong><small>연등광장 · 초록 연등</small></div><button class="textbtn" data-action="seat">자리 변경</button></div><label>표시 이름 <small>선택</small><input placeholder="이름을 입력해 주세요" maxlength="12"></label><label class="check"><input type="checkbox"> 연등 아래 이름표 달기</label><label>담고 싶은 마음<textarea placeholder="우리 가족이 평안하기를 바랍니다." maxlength="100"></textarea></label><label class="check"><input type="checkbox"> 다른 방문자에게 문구 공개하기</label><div class="reservation"><button class="primary" data-action="reserve">이 자리에 예약</button><p class="quiet">예약할 때만 로그인이 필요합니다</p></div></section>`;}
if(id==='practice'){html+=`<div class="practice-label">대웅전<strong>지금, 한 번의 절에 집중합니다.</strong></div><section class="practice-bar"><div>108배 수행 중</div><div class="count">32 <small>/ 108배</small></div><div class="progress"><span></span></div><p>호흡을 고르고 천천히 이어가세요.</p><button data-action="stop">수행 중단</button></section>`;}
if(id==='private'){html+=`<div class="private-tag">시간과 공간의 방 · 나만 볼 수 있는 공간</div><nav class="private-toolbar"><button data-action="privateBow">${svg('lotus')} 절하기</button><button data-action="meditate">명상하기</button><button data-action="decorate">공간 꾸미기</button></nav><button class="return" data-action="return">사찰로 돌아가기 ↗</button>`;}
return `<div class="scene-wrap ${mobile?'mode-mobile':''}" data-scene="${id}"><div class="scene" style="background-image:url('${id}.jpg')">${html}</div></div>`;}
function caption(s,i){return `<div class="caption"><span class="num">0${i+1}</span><div><strong>${s[1]}</strong><p>${s[2]}</p></div></div>`;}
function render(){document.querySelector('#toolbar').innerHTML=`<button data-view="all" aria-pressed="${current==='all'}">전체 비교</button>`+states.map(s=>`<button data-view="${s[0]}" aria-pressed="${current===s[0]}">${s[1]}</button>`).join('')+`<span class="spacer"></span><button id="desktop" aria-pressed="${!mobile}">웹</button><button id="mobile" aria-pressed="${mobile}">모바일 웹</button><span class="review-note">화면 안 버튼을 눌러 살펴보세요</span>`;
const main=document.querySelector('#main');main.className=current==='all'?'board':'single';main.innerHTML=(current==='all'?states:states.filter(s=>s[0]===current)).map(s=>`<article>${frame(s[0])}${caption(s,states.indexOf(s))}</article>`).join('')+(current==='all'?`<section class="principles"><div class="eyebrow">LESS UI, MORE TEMPLE</div><h2>공간이 먼저 보이고,<br>행동은 필요한 순간에.</h2><p>상시 메뉴는 공간·수행·내 모습 세 가지.<br>신청은 종무소 또는 현장 빈자리에서.<br>로그인은 예약과 108배 시작 시점에.<br>내 아이템 찾기·자동 위치 안내는 두지 않습니다.</p><div class="legend"><span><i class="swatch" style="background:#264b3b"></i>소나무 녹색</span><span><i class="swatch" style="background:#e6ddc4"></i>한지색</span><span><i class="swatch" style="background:#bca16c"></i>금색 강조</span></div></section>`:'');}
function overlay(scene,title,content,cls=''){scene.querySelector('.veil')?.remove();scene.insertAdjacentHTML('beforeend',`<div class="veil"><section class="surface ${cls}"><button class="close" data-action="close" aria-label="닫기">×</button><h2>${title}</h2>${content}</section></div>`);}
function seat(scene){overlay(scene,'연등 자리 고르기',`<p>위에서 본 줄을 선택한 뒤 자리를 확대합니다.</p><div class="row-choose">${['A','B','C','D','E'].map(r=>`<button data-row="${r}" class="${r===selectedRow?'selected':''}">${r}줄</button>`).join('')}</div><h3>${selectedRow}줄 · 자리 선택</h3><div class="row-grid">${Array.from({length:15},(_,i)=>`<button data-seat="${i+1}" ${[2,6,10].includes(i)?'disabled':''} class="${String(i+1)===selectedSeat?'selected':''}">${i+1}</button>`).join('')}</div><p>흐린 자리는 선택할 수 없습니다.</p><button class="primary" data-action="seatConfirm">${selectedRow}줄 ${selectedSeat}번 선택</button>`);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){current=b.dataset.view;render();return;}if(b.id==='mobile'||b.id==='desktop'){mobile=b.id==='mobile';render();return;}const scene=b.closest('.scene');if(!scene)return;if(b.dataset.row){selectedRow=b.dataset.row;seat(scene);return;}if(b.dataset.seat){selectedSeat=b.dataset.seat;seat(scene);return;}const a=b.dataset.action;
if(a==='close'){scene.querySelector('.veil')?.remove();return;}
if(a==='map'){overlay(scene,'사찰 지도',`<p>머물고 싶은 공간을 선택해 보세요.</p><div class="map-image"><button class="map-pin" data-action="goHall" style="left:34%;top:16%">대웅전</button><button class="map-pin" data-action="goOffice" style="left:60%;top:64%">종무소 · 접수</button><button class="map-pin" data-action="goPond" style="left:66%;top:79%">연못</button></div><p class="no-margin">직접 걸어서도 모든 공간을 둘러볼 수 있습니다.</p>`,'map-panel');}
if(a==='menu'){overlay(scene,'사사에서 머무르기',`<div class="menu-links"><button data-action="map">사찰 지도</button><button data-action="schedule">오늘의 일정</button><button data-action="goOffice">등과 소원 접수</button><button data-action="history">로그인 · 내 이용 내역</button><button data-action="settings">언어 · 화면 · 소리 설정</button></div>`);}
if(a==='schedule'){overlay(scene,'사찰의 하루',`<p>한국 시간 기준 · 중간에 들어와도 같은 대목을 함께 듣습니다.</p>${[['05:00','새벽 예불'],['10:00','사시 기도'],['18:00','저녁 예불'],['20:00','오늘의 법문']].map(([t,n])=>`<div class="chosen" style="margin-top:.6em"><b>${t}</b><span>${n}</span></div>`).join('')}<p>일정이 없는 시간에는 자유롭게 수행하세요.</p>`);}
if(a==='seat')seat(scene);if(a==='seatConfirm'){scene.querySelector('.chosen strong').textContent=selectedRow+'줄 · '+selectedSeat+'번';scene.querySelector('.pin').textContent='선택한 자리 · '+selectedRow+'–'+selectedSeat;scene.querySelector('.veil').remove();}
if(a==='reserve'||a==='practice'){overlay(scene,'마음을 이어가기',`<p>${a==='reserve'?selectedRow+'줄 '+selectedSeat+'번 자리와 작성 중인 문구를 보관하고 있습니다.':'108배는 로그인한 회원이 이용할 수 있습니다.'}</p><div class="login-options"><button class="primary" data-action="demoLogin">이메일 링크로 로그인</button><button class="primary" data-action="demoLogin" style="background:#e6eadc;color:#34503c">Google로 계속하기</button><button class="primary" data-action="demoLogin" style="background:#e6eadc;color:#34503c">Apple로 계속하기</button></div><p class="quiet">시안에서는 실제 로그인을 요청하지 않습니다</p>`);}
if(a==='demoLogin'){overlay(scene,'선택한 화면으로 돌아옵니다',`<div class="status">로그인 이후 같은 자리·같은 신청 내용으로 이어지는 흐름입니다.</div><button class="primary" data-action="close">신청 계속하기</button>`);}
if(a==='appearance'){overlay(scene,'내 모습',`<p>지금의 모습을 보고 얼굴과 법복을 바꿉니다.</p><div class="menu-links"><button data-action="demoNotice">사람 · 십이지신 얼굴 선택</button><button data-action="demoNotice">법복 입기 / 벗기</button><button data-action="demoNotice">1인칭 / 3인칭 시점</button></div>`);}
if(a==='coin'){overlay(scene,'소원을 비세요',`<p>마음속으로 소원을 떠올린 뒤 동전을 던집니다.</p><div style="font:4em Georgia;text-align:center;margin:.4em">3 · 2 · 1</div><button class="primary" data-action="close">산책으로 돌아가기</button>`);}
if(a==='stop'){overlay(scene,'수행을 마칠까요?',`<p>잠시 쉬어가도 괜찮습니다.</p><button class="primary" data-action="close">계속 수행하기</button><button class="textbtn" data-action="return">수행 마치기</button>`);}
if(['privateBow','meditate','decorate'].includes(a)){overlay(scene,a==='decorate'?'내 공간 꾸미기':a==='meditate'?'명상하기':'절하기',`<p>${a==='decorate'?'내가 구매한 연등·소원패·인등·추모등·봉헌초를 골라 전시합니다.':'이 공간에서는 나만 조용히 수행합니다.'}</p><button class="primary" data-action="close">공간으로 돌아가기</button>`);}
if(['return','dismiss','goHall','goOffice','goPond'].includes(a)){current=a==='goOffice'?'offering':a==='goPond'?'explore':a==='goHall'?'practice':'arrival';render();}
if(['history','settings','demoNotice'].includes(a))overlay(scene,a==='history'?'내 이용 내역':a==='settings'?'설정':'내 모습 바꾸기',`<p>세부 기능은 기존 화면을 이어 사용합니다.<br>이번 시안은 메뉴 위치와 이용 흐름을 확인하는 용도입니다.</p><button class="primary" data-action="close">돌아가기</button>`);
});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.veil').forEach(el=>el.remove());});const params=new URLSearchParams(location.search);current=params.get('view')||'all';mobile=params.get('mobile')==='1';render();
</script></html>
