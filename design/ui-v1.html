<header class="review"><div><h1>사사 · 전체 UI 설계</h1><small>v1 · 화면 구조와 동선 검토</small></div><span>설계 시안 <small>· 2026.11.10</small></span></header>
<main><aside id="nav"></aside><section class="workspace"><div class="bar"><h2 id="screen-title"></h2><div><button id="desktop" aria-pressed="true">웹</button> <button id="mobile" aria-pressed="false">모바일 웹</button></div></div><div class="stage" id="stage"></div><div class="note"><div><h3>화면의 역할</h3><p id="purpose"></p></div><div><h3>연결과 상태</h3><p id="flow"></p></div></div><div class="foot">시안의 결제·로그인은 화면 흐름을 확인하는 동작입니다. 실제 처리는 기존 사찰 웹에서 검수합니다.</div></section></main>

['explore','탐방 기본 화면','3D 공간을 넓게 보여주고 현재 위치와 필요한 행동을 안내한다.','비회원도 이동·관람·다른 방문자 보기를 이용한다. 현장 행동은 가까이 왔을 때 나타난다.'],
['menu','전체 메뉴','장소·수행·신청·계정·설정으로 이어지는 메뉴를 제공한다.','화면 패널은 한 번에 하나만 열고 닫으면 원래 카메라로 복귀한다.'],

['신청',['products','다섯 아이템','아이템 의미·기간·신청 장소를 비교한다.','구매 전 연등은 이름표 없이, 소원패는 빈 패, 봉헌초는 소등 상태를 유지한다.'],
['map','연등 배치도','위에서 본 배치도에서 줄을 누르고 확대해 자리를 선택한다.','현장 빈자리 선택과 동일한 자리 번호를 사용한다. 다른 아이템은 해당 구역의 자리 목록을 제공한다.'],
['slot','선택한 자리','위치·사용 기간·현재 가격을 확인하고 신청 정보를 준비한다.','비회원 선택과 입력을 보존한다. “이 자리에 예약”에서 로그인을 요청한다.'],
['form','신청 정보','표시 이름·문구·이름표와 공개 동의를 명시적으로 입력한다.','실명 입력을 강제하지 않는다. 공개 기본값은 비공개이며, 검증 오류는 해당 필드 옆에 표시한다.'],
['login','로그인','이메일 링크·Google·Apple 진입 경로를 제공한다.','예약 또는 108배의 원래 화면으로 복귀한다. 제공자 설정과 취소·실패·만료 상태는 별도 안내한다.'],
['checkout','예약·결제','확보한 자리와 예약 남은 시간, 주문 금액을 확인한다.','결제 결과 확인 중에는 같은 주문을 조회한다. 가격 변경은 재확인하고 만료 시 자리 선택으로 돌아간다.'],

  checks[0].checked=draft.tag;checks[1].checked=draft.public;
 }
 if(current==='slot')stage.querySelector('.panel select').value=term;
 if(current==='checkout'){
  const rows=stage.querySelectorAll('.panel .row');
  rows[1].querySelector('b').textContent=term;
 }

}
document.addEventListener('input',()=>{
 if(current==='form'){
  draft.name=stage.querySelector('input[maxlength]').value;
  draft.text=stage.querySelector('textarea').value;
  const checks=stage.querySelectorAll('input[type=checkbox]');
  draft.tag=checks[0].checked;draft.public=checks[1].checked;
 }
 if(current==='slot')term=stage.querySelector('.panel select').value;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&current!=='entry'){current='explore';render();}});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.to){if(b.dataset.to==='login')returnTo=current==='account'?'account':'explore';current=b.dataset.to;render();}
 else if(b.dataset.product){product=b.dataset.product;current='map';render();}
 else if(b.dataset.row){selectedRow=+b.dataset.row;render();}
 else if(b.dataset.slot){selectedSlot=+b.dataset.slot;current='slot';render();}
 else if(b.hasAttribute('data-reserve')){returnTo='checkout';current='login';render();}
 else if(b.hasAttribute('data-login')){logged=true;current=returnTo;render();}
 else if(b.hasAttribute('data-pay')){result='installing';current='result';render();}
 else if(b.dataset.result){result=b.dataset.result;render();}
 else if(b.hasAttribute('data-practice')){if(!logged){returnTo='practice';current='login';}else count=Math.min(108,count+1);render();}
 else if(b.hasAttribute('data-stop')){count=0;render();}
 else if(b.hasAttribute('data-wish')&&!wishing){wishing=true;let n=3;b.disabled=true;$('wish-label').textContent='소원을 비세요 · '+n;const timer=setInterval(()=>{n--;if(n){$('wish-label').textContent='소원을 비세요 · '+n;}else{clearInterval(timer);wishing=false;if(current==='wish'){$('wish-label').textContent='동전이 날아갑니다';b.disabled=false;}}},1000);}
 else if(b.hasAttribute('data-logout')){logged=false;render();}
 else if(b.hasAttribute('data-language')||b.hasAttribute('data-filter')){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');}
 else if(b.hasAttribute('data-share'))$('public-feedback').textContent='공개 상태를 확인한 뒤 공유 링크를 제공합니다.';
 else if(b.hasAttribute('data-report'))$('public-feedback').textContent=logged?'신고 사유 입력 화면으로 이어집니다.':'로그인 후 같은 문구의 신고로 이어집니다.';
 else if(b.hasAttribute('data-delete'))$('settings-feedback').textContent='진행 중인 거래와 처리 결과를 확인한 뒤 삭제를 요청합니다.';
 else if(b.hasAttribute('data-staff'))$('staff-feedback').textContent='대상 상세 → 권한 확인 → 처리 사유 → 실행 결과와 감사 기록';
});
$('desktop').onclick=()=>{mobile=false;$('desktop').setAttribute('aria-pressed','true');$('mobile').setAttribute('aria-pressed','false');render()};
$('mobile').onclick=()=>{mobile=true;$('desktop').setAttribute('aria-pressed','false');$('mobile').setAttribute('aria-pressed','true');render()};
render();
</script></html>
