<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>사사 · 사람형 캐릭터 비교</title></head><body><main><header><a href="/">사사</a><div><h1>조금 더 사람다운 모습</h1><p>같은 조명 · 같은 동작 · 실제 3D 비교</p></div><span class="preview">캐릭터 검토용</span></header><section class="stage"><div class="titles"><div>이전 캐릭터</div><div>현재 적용된 사람형 <small>부드러운 얼굴 · 가는 손 · 이어지는 관절</small></div></div><canvas id="character-canvas" aria-label="현재형과 개선형 캐릭터 3D 비교" tabindex="0"></canvas><div class="stage-hint">화면을 밀면 두 캐릭터가 함께 돌아갑니다.</div></section><section class="controls" aria-label="캐릭터 비교 조작"><div class="row"><strong>보는 방향</strong><button data-angle="0" aria-pressed="true">정면</button><button data-angle="0.6">비스듬히</button><button data-angle="1.57079632679">옆면</button><button id="face-close" aria-pressed="false">얼굴 확대</button><button id="robe" aria-pressed="false">법복 입기</button></div><div class="row"><strong>동작 확인</strong><button data-motion="stand" aria-pressed="true">서 있기</button><button data-motion="joined">합장</button><button data-motion="bow">절하기 재생</button><button data-motion="meditation">앉아서 명상</button><button id="pause" disabled>일시정지</button></div><label class="timeline">절하기 단계<input id="pose" type="range" min="0" max="1000" value="0"><output id="phase">서 있기</output></label><p class="note">오른쪽 외형을 사찰 방문자·스님·가상 방문객에 적용했습니다. 기존 절하기와 12지신 얼굴 선택은 유지됩니다.</p></section></main><script type="module" src="/src/character-study.ts"></script></body></html>
