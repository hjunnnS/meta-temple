<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>법복과 108배 효과 · 사사</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e3d8;color:#28392e;font-family:system-ui,sans-serif}main{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header,footer{padding:16px clamp(16px,5vw,70px);display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font:500 clamp(20px,3vw,30px) serif;margin:0 auto 0 0}a{color:inherit}canvas{width:100%;height:100%;display:block;touch-action:none}button{background:#f9f6ef;color:#294436;border:1px solid #a89e8c;border-radius:6px;padding:12px 16px;font:inherit;cursor:pointer}button[aria-pressed=true],#replay{background:#304e40;color:white}button:disabled{opacity:.65}#replay{margin-left:auto}small{flex-basis:100%}</style></head><body><main><header><h1>법복과 108배 효과 미리보기</h1><a href="/">사찰 입구</a></header><canvas id="preview" aria-label="드래그로 회전하는 아바타 미리보기"></canvas><footer><button id="everyday" aria-pressed="true">평상복</button><button id="robe" aria-pressed="false">법복</button><button id="replay">108배 수행 → 완료 보기</button><output id="phase" aria-live="polite"></output><small>드래그해서 둘러보세요. 이 화면은 수행 횟수에 포함되지 않습니다.</small></footer></main><script type="module" src="/src/practice-preview.ts"></script></body></html>
